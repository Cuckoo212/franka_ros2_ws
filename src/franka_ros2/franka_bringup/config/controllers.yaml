# This is a namespace agnostic configuration file for the Franka FR3 robot.
# That is to say, it is not tied to any specific namespace and can be used in
# any namespace. 
# If you require namespace specific configurations, you can easily modify this
# file to include the namespace
# As an example, below you can find:
#
# /**:
#   franka_robot_state_broadcaster:
#     ros__parameters:
#       lock_try_count: 5
#       lock_sleep_interval: 5
#
# Imagine, you have a specific need to have the lock try count in namespace "NAMESPACE_X"
# to be different than the default value of 5, but leave all the other namespaces as default.
# Add the following lines to the configuration file 
# (or use a different config file, but then you have to mody the launch script to reference that file)
#
# /NAMESPACE_X:
#   franka_robot_state_broadcaster:
#     ros__parameters:
#       lock_try_count: 10
#       lock_sleep_interval: 35
# /**:
#   franka_robot_state_broadcaster:
#     ros__parameters:
#       lock_try_count: 5
#       lock_sleep_interval: 5


/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000
      thread_priority: 98

      cartesian_elbow_example_controller:
        type: franka_example_controllers/CartesianElbowExampleController

      cartesian_orientation_example_controller:
        type: franka_example_controllers/CartesianOrientationExampleController

      cartesian_pose_elbow_example_controller:
        type: franka_example_controllers/CartesianElbowExampleController

      cartesian_pose_example_controller:
        type: franka_example_controllers/CartesianPoseExampleController

      cartesian_target_point_controller:
        type: franka_example_controllers/CartesianTargetPointBoardController

      cartesian_target_point_board_controller:
        type: franka_example_controllers/CartesianTargetPointBoardController

      cartesian_target_point_air_controller:
        type: franka_example_controllers/CartesianTargetPointAirController

      cartesian_apriltag_position_controller:
        type: franka_example_controllers/CartesianApriltagPositionController

      cartesian_cable_trajectory_controller:
        type: franka_example_controllers/CartesianCableTrajectoryController

      cartesian_cable_air_interact_controller:
        type: franka_example_controllers/CartesianCableAirInteractController

      cartesian_cable_board_interact_controller:
        type: franka_example_controllers/CartesianCableBoardInteractController

      cartesian_velocity_example_controller:
        type: franka_example_controllers/CartesianVelocityExampleController

      elbow_example_controller:
        type: franka_example_controllers/ElbowExampleController

      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
        state_interfaces:
          robot_state

      gravity_compensation_example_controller:
        type: franka_example_controllers/GravityCompensationExampleController

      gripper_example_controller:
        type: franka_example_controllers/GripperExampleController

      joint_impedance_example_controller:
        type: franka_example_controllers/JointImpedanceExampleController

      joint_impedance_with_ik_example_controller:
        type: franka_example_controllers/JointImpedanceWithIKExampleController

      joint_position_example_controller:
        type: franka_example_controllers/JointPositionExampleController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      joint_velocity_example_controller:
        type: franka_example_controllers/JointVelocityExampleController

      model_example_controller:
        type: franka_example_controllers/ModelExampleController

      move_to_start_example_controller:
        type: franka_example_controllers/MoveToStartExampleController

      mobile_cartesian_velocity_example_controller:
        type: franka_example_controllers/MobileCartesianVelocityExampleController

/**:
  franka_robot_state_broadcaster:
    ros__parameters:
      lock_try_count: 5 # Number of attempts to acquire the lock in a single on_update()
      lock_sleep_interval: 5 # microseconds sleep between attempts
      lock_log_error: true #  Log error if lock acquisition fails - false == do not log  
      lock_update_success: false # return update OK, although lock fails (no update occurs)
      
/**:
  joint_impedance_example_controller:
    ros__parameters:  
      k_gains:
        - 24.0
        - 24.0
        - 24.0
        - 24.0
        - 10.0
        - 6.0
        - 2.0
      d_gains:
        - 2.0
        - 2.0
        - 2.0
        - 1.0
        - 1.0
        - 1.0
        - 0.5

/**:
  joint_impedance_with_ik_example_controller:
    ros__parameters:
      k_gains:
        - 600.0
        - 600.0
        - 600.0
        - 600.0
        - 250.0
        - 150.0
        - 50.0
      d_gains:
        - 30.0
        - 30.0
        - 30.0
        - 30.0
        - 10.0
        - 10.0
        - 5.0

/**:
  move_to_start_example_controller:
    ros__parameters:
      k_gains:
        - 600.0
        - 600.0
        - 600.0
        - 600.0
        - 250.0
        - 150.0
        - 50.0
      d_gains:
        - 30.0
        - 30.0
        - 30.0
        - 30.0
        - 10.0
        - 10.0
        - 5.0

/**:
  joint_position_example_controller:
    ros__parameters:
      gazebo: false

/**:
  cartesian_pose_example_controller:
    ros__parameters:
      gazebo: false

/**:
  cartesian_cable_air_interact_controller:
    ros__parameters:
      gazebo: false
      interaction_enabled: true
      interaction_amplitude: 0.03
      interaction_move_duration: 3.0
      interaction_hold_duration: 0.5
      interaction_publish_rate: 30.0
      gripper_width: 0.004
      gripper_speed: 0.02
      gripper_force: 10.0

/**:
  cartesian_cable_board_interact_controller:
    ros__parameters:
      gazebo: false
      interaction_enabled: true
      interaction_amplitude: 0.06
      interaction_move_duration: 3.0
      interaction_hold_duration: 0.5
      interaction_publish_rate: 30.0
      interaction_resistance_force_threshold: 10.0
      close_gripper_with_move: false
      continue_after_gripper_close_failure: true
      gripper_width: 0.004
      gripper_speed: 0.02
      gripper_force: 10.0
      gripper_epsilon_inner: 0.004
      gripper_epsilon_outer: 0.020
/**:
  cartesian_apriltag_position_controller:
    ros__parameters:
      gazebo: false
      target_pose_topic: /apriltag_target_pose
      start_approach_topic: /cartesian_apriltag_position_controller/start_approach
      expected_frame_id: fr3_link0
      strict_frame_check: true
      track_target_updates: false
      close_gripper_on_start: true
      home_gripper_on_start: false
      gripper_width: 0.004
      gripper_speed: 0.02
      gripper_force: 10.0
      gripper_epsilon_inner: 0.004
      gripper_epsilon_outer: 0.020
      hover_offset:
        - 0.0
        - 0.0
        - -0.15
      move_to_hover_duration: 20.0
      move_to_target_duration: 15.0
      target_position_tolerance: 0.01
      target_orientation_tolerance: 0.10
      cartesian_stiffness:
        - 350.0
        - 350.0
        - 450.0
        - 20.0
        - 20.0
        - 18.0
      cartesian_damping:
        - 37.0
        - 37.0
        - 42.0
        - 8.0
        - 8.0
        - 7.5
      max_torque_deltas:
        - 0.08
        - 0.08
        - 0.08
        - 0.07
        - 0.06
        - 0.05
        - 0.04
      max_translation_error: 0.10
      max_rotation_error: 0.35
