/**:
  ros__parameters:
    planning_group: fr3_arm
    move_group_namespace: /NS_1
    base_frame: fr3_link0
    tcp_link: fr3_hand_tcp
    end_effector_link: fr3_hand_tcp
    cloud_topic: /cable_camera/cable_points
    clicked_point_topic: /clicked_point
    auto_generate: true
    local_radius: 0.025
    min_local_points: 12
    pca_ratio: 4.0
    max_line_offset: 0.01
    # Static-scene selection uses a frozen point-cloud snapshot.
    require_fresh_cloud: false
    max_cloud_age: 2.0
    roll_step_degrees: 10.0
    approach_distance: 0.04
    cartesian_step: 0.003
    jump_threshold: 2.0
    ik_attempts: 2
    planning_time: 1.0
    velocity_scaling: 0.1
    acceleration_scaling: 0.1
    validation_joint_step: 0.03
    # Advisory thresholds only; neither rejects a MoveIt-valid path.
    min_joint_margin: 0.02
    min_dexterity: 0.005
    jacobian_length_scale: 0.3
    weight_margin: 3.0
    weight_dexterity: 1.0
    weight_clearance: 1.0
    weight_length: 0.1
    target_offset: [0.0, 0.0, 0.0]
    tf_timeout: 1.0
    start_tolerance: 0.02
    gripper_enabled: true
    gripper_namespace: /NS_1/franka_gripper
    gripper_joint_names: [fr3_finger_joint1, fr3_finger_joint2]
    open_width: 0.08
    grasp_width: 0.004
    gripper_speed: 0.02
    gripper_force: 10.0
    grasp_epsilon: 0.003
    gripper_timeout: 15.0
    # Recorded placement arm posture, radians. Release only after successful arrival.
    place_enabled: true
    place_joint_names: [fr3_joint1, fr3_joint2, fr3_joint3, fr3_joint4, fr3_joint5, fr3_joint6, fr3_joint7]
    place_joint_positions: [-0.5233661532402039, -1.5837199687957764, -0.40842023491859436, -1.467320442199707, -1.0411325693130493, 1.900314211845398, -2.7240424156188965]
    place_planning_time: 5.0
    place_goal_tolerance: 0.01
    # Release arrival check; independent of the tighter planning goal tolerance.
    place_arrival_tolerance: 0.10
    # P1..P7 ordered boundary in fr3_link0, shifted -0.024 m along base Y from recorded positions.
    # Project onto fitted plane; total thickness is symmetric about that plane.
    platform_enabled: true
    platform_thickness: 0.01
    platform_points: [-0.252, -0.504, 0.422, -0.234, -0.515, 0.936, 0.108, -0.524, 0.953, 0.380, -0.530, 0.907, 0.557, -0.531, 0.740, 0.644, -0.528, 0.573, 0.653, -0.525, 0.454]
    # Lift straight upward in robot base +Y after grasping, with fixed orientation.
    lift_distance: 0.40
    lift_position_tolerance: 0.01
    # Within this base-Y height gap from the +Y platform face, TCP Z = base -Y.
    near_board_height_threshold: 0.01
    # Original selected point gap < 8 mm: raise TCP target by 5 mm along base +Y.
    near_board_raise_threshold: 0.008
    near_board_target_raise: 0.005
