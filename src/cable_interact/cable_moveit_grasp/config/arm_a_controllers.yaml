# Shared wildcard namespace; keep each top-level key unique.
/**:
  controller_manager:
    ros__parameters:
      update_rate: 1000
      fr3_arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      franka_robot_state_broadcaster:
        type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster
        state_interfaces:
        - robot_state
  franka_robot_state_broadcaster:
    ros__parameters:
      arm_prefix: a
      robot_type: fr3
      lock_try_count: 5
      lock_sleep_interval: 5
      lock_log_error: false
      lock_update_success: true
  fr3_arm_controller:
    ros__parameters:
      command_interfaces:
      - effort
      state_interfaces:
      - position
      - velocity
      joints:
      - a_fr3_joint1
      - a_fr3_joint2
      - a_fr3_joint3
      - a_fr3_joint4
      - a_fr3_joint5
      - a_fr3_joint6
      - a_fr3_joint7
      gains:
        a_fr3_joint1:
          p: 600.0
          d: 30.0
          i: 0.0
          i_clamp: 1.0
        a_fr3_joint2:
          p: 600.0
          d: 30.0
          i: 0.0
          i_clamp: 1.0
        a_fr3_joint3:
          p: 600.0
          d: 30.0
          i: 0.0
          i_clamp: 1.0
        a_fr3_joint4:
          p: 600.0
          d: 30.0
          i: 0.0
          i_clamp: 1.0
        a_fr3_joint5:
          p: 250.0
          d: 10.0
          i: 0.0
          i_clamp: 1.0
        a_fr3_joint6:
          p: 150.0
          d: 10.0
          i: 0.0
          i_clamp: 1.0
        a_fr3_joint7:
          p: 50.0
          d: 5.0
          i: 0.0
          i_clamp: 1.0
