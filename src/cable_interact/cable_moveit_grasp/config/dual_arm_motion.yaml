/**:
  ros__parameters:
    execution_enabled: false
    # D456: user-specified protection size, NOT verified housing/support dimensions.
    # Axes and center offset are in cable_camera_color_optical_frame (metres).
    camera_obstacle_enabled: true
    camera_obstacle_size: [0.12, 0.05, 0.04]
    camera_obstacle_center_optical: [0.0, 0.0, 0.0]
    use_rviz_grasp_plan: true
    grasp_a_from_b_enabled: true
    grasp_a_use_current_b_tcp: true  # Use B TCP at grasp_a time, including motion to FIX_B.
    grasp_a_from_b_x_offset: 0.10
    grasp_a_from_b_x_tolerance: 0.01
    # Each point: close at original TCP, original local Z -1cm, original local Z +1cm.
    # After three confirmed misses: open, HOME, reselect; bounded to one new point.
    grasp_max_reselections: 1
    grasp_a_recovery_x_offset: 0.15
    grasp_b_recovery_x_offset: 0.05
    grasp_recovery_x_tolerance: 0.01
    grasp_b_auto_enabled: true
    grasp_b_search_x_min: -0.30
    grasp_b_min_board_clearance: 0.03  # Strictly >3cm from modeled board surface.
    grasp_b_search_a_tcp_clearance: 0.10
    grasp_a_search_x_length: 0.30
    grasp_quality_min_length: 0.05
    grasp_quality_max_gap: 0.006  # 3D neighbor distance; gaps larger than 6mm split the cable.
    grasp_quality_voxel_size: 0.002
    candidate_plan_timeout: 120.0
    # Recorded HOME/FIX targets: joint1 -> joint7, radians.
    homeA: [-0.09649910032749176, -1.7455260753631592, 0.02435990981757641, -1.9847580194473267, 1.6875145435333252, 1.5070719718933105, -0.42476212978363037]
    homeB: [-0.058996085077524185, -1.8008403778076172, -0.08013536781072617, -2.025684118270874, -1.5123728513717651, 1.7200734615325928, 1.3071010112762451]
    fixA: [-0.1617502123117447, -1.6100363731384277, 0.05374401435256004, -2.7575788497924805, 1.7071529626846313, 1.555440068244934, -1.7623674869537354]
    fixB: [-0.10162438452243805, -1.5841867923736572, -0.011694415472447872, -2.7515335083007812, -1.5468088388442993, 1.6990561485290527, 0.41683006286621094]
    # HOME/FIX arrival checks only. Grasp closes after MoveIt execution succeeds.
    # Global/B tolerance unchanged. Only A joint7 permits up to 10 degrees (0.17453292519943295 rad).
    arrival_joint_tolerance: 0.02
    arrival_joint_tolerances_a: [0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.17453292519943295]
    arrival_timeout: 3.0
    arrival_stable_duration: 0.1
    # FIX: recorded TCP position only; prefer measured starting orientation.
    # Adaptive Cartesian orientation candidates only if constant-orientation translation fails.
    fix_tcp_max_total_rotation: 3.141592653589793  # |terminal signed sum| <=180 deg; no intermediate peak limit
    planning_time: 5.0
    velocity_scaling: 0.05
    acceleration_scaling: 0.05
